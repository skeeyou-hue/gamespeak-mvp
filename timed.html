<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameSpeak — Tiered Timed Pitch</title>
  <link rel="stylesheet" href="scene.css">
  <link rel="stylesheet" href="timed.css">
</head>
<body>

  <!-- The same ballpark Classic plays in. Markup lives in scene.js. -->
  <div class="scene" id="scene-mount" aria-hidden="true"></div>

  <header class="header">
    <h1 class="logo">GameSpeak</h1>
    <p class="mode-name">Tiered Timed Pitch</p>
  </header>

  <!-- HUD: runs, outs, who's on, and whether a power swing is banked -->
  <section class="hud" aria-label="Scoreboard">
    <div class="hud-chip">
      <span class="hud-label">R</span>
      <span class="hud-runs" id="hud-runs">0</span>
      <span class="hud-rule"></span>
      <span class="hud-label">O</span>
      <span class="outs" id="hud-outs" aria-live="polite">
        <span class="out-dot"></span><span class="out-dot"></span><span class="out-dot"></span>
      </span>
    </div>

    <span class="hud-bank hidden" id="hud-bank">SWING BANKED</span>

    <div class="hud-chip hud-bases">
      <svg class="diamond" viewBox="0 0 60 60" aria-hidden="true">
        <rect class="pip" id="pip-second" x="25" y="5"  width="10" height="10" transform="rotate(45 30 10)"/>
        <rect class="pip" id="pip-third"  x="4"  y="25" width="10" height="10" transform="rotate(45 9 30)"/>
        <rect class="pip" id="pip-first"  x="46" y="25" width="10" height="10" transform="rotate(45 51 30)"/>
        <polygon class="home-plate" points="24,41 36,41 36,46 30,52 24,46"/>
      </svg>
    </div>
  </section>

  <main class="field">

    <!-- ============================================================
         THE PITCH: one word, one clock. The bar drains and its label
         says what a correct answer is worth at this instant.
         ============================================================ -->
    <section class="card" id="pitch-screen">
      <div class="pitch-top">
        <span class="pitch-tags">
          <span class="tier-badge" id="tier-badge">EASY · 3.0s</span>
          <!-- Which way this pitch is coming. Set per at-bat, held across
               a re-pitch, so it never changes under the player mid-count. -->
          <span class="direction-hint" id="direction-hint">→ English</span>
        </span>
        <span class="strike-pips" id="strike-pips" aria-label="Strikes">
          <span class="strike-pip"></span><span class="strike-pip"></span><span class="strike-pip"></span>
        </span>
      </div>

      <div class="clock-row">
        <span class="payoff pay-homerun" id="payoff">HOME RUN</span>
        <span class="clock-num" id="clock-num">3.0</span>
      </div>

      <div class="timer" aria-hidden="true">
        <div class="timer-fill pay-homerun" id="timer-fill"></div>
      </div>

      <h2 class="word" id="word">—</h2>

      <!-- Only appears while a swing is banked. Taking it is always the
           player's choice — the word is still there to answer instead. -->
      <button class="bank-button hidden" id="bank-button">
        Swing for the fences <span class="bank-life" id="bank-life"></span>
      </button>

      <div class="choices" id="choices"></div>
      <p class="feedback" id="feedback">&nbsp;</p>
    </section>


    <!-- ============================================================
         THE POWER SWING
         Spending a banked swing replaces the whole at-bat: no word, no
         countdown, no count. A marker sweeps; one press stops it.
         ============================================================ -->
    <section class="card hidden" id="swing-screen">
      <p class="swing-eyebrow">Banked swing</p>

      <!-- The dugout, shouting -->
      <p class="dugout-es" id="dugout-phrase">¡Vamos!</p>
      <p class="dugout-en" id="dugout-gloss">Let's go!</p>

      <svg class="swing-figure" id="swing-figure" viewBox="0 0 220 200" aria-hidden="true">
        <ellipse cx="96" cy="190" rx="46" ry="8" fill="#0a2a18" opacity="0.3"/>
        <path d="M74,120 L96,120 L92,184 L70,184 Z" fill="#F4EDE0"/>
        <path d="M102,120 L124,120 L130,184 L108,184 Z" fill="#F4EDE0"/>
        <path d="M76,120 L82,120 L78,184 L72,184 Z" fill="#0E4C5C" opacity="0.8"/>
        <path d="M118,120 L124,120 L128,184 L122,184 Z" fill="#0E4C5C" opacity="0.8"/>
        <ellipse cx="80" cy="188" rx="17" ry="7" fill="#12313B"/>
        <ellipse cx="120" cy="188" rx="17" ry="7" fill="#12313B"/>

        <path d="M64,68 Q98,54 132,68 L138,124 Q98,136 58,124 Z" fill="#F4EDE0"/>
        <path d="M64,68 Q98,54 132,68 L133,82 Q98,69 63,82 Z" fill="#0E4C5C"/>
        <path d="M63,82 Q98,69 133,82 L133,87 Q98,74 63,87 Z" fill="#F2A73B"/>
        <text x="98" y="116" text-anchor="middle" font-family="system-ui, sans-serif"
              font-size="30" font-weight="800" fill="#0E4C5C"
              stroke="#F2A73B" stroke-width="1.2">21</text>

        <g stroke="#E2D5BC" stroke-width="14" stroke-linecap="round" fill="none">
          <path d="M72,86 Q110,84 146,64"/>
          <path d="M126,74 Q140,74 150,65"/>
        </g>
        <g stroke="#0E4C5C" stroke-width="1.5" opacity="0.35" fill="none">
          <path d="M72,79 Q110,77 145,57"/>
        </g>
        <circle cx="152" cy="62" r="10" fill="#12313B"/>

        <ellipse cx="98" cy="46" rx="22" ry="20" fill="#0E4C5C"/>
        <path d="M78,48 Q72,62 82,69 Q92,70 95,59 Z" fill="#0E4C5C"/>
        <path d="M77,39 Q98,28 119,39 Q98,33 77,39 Z" fill="#F2A73B" opacity="0.9"/>
        <text x="99" y="54" text-anchor="middle" font-family="system-ui, sans-serif"
              font-size="13" font-weight="800" fill="#F2A73B">SJ</text>

        <!-- The bat gets its own group so it can leave on its own -->
        <g id="swing-bat">
          <path d="M150,58 L204,8" stroke="#C98A4B" stroke-width="11" stroke-linecap="round"/>
          <path d="M148,63 L160,49" stroke="#8A5A2B" stroke-width="13" stroke-linecap="round"/>
        </g>
      </svg>

      <div class="swing-track" id="swing-track">
        <div class="swing-sweet" id="swing-sweet"></div>
        <div class="swing-marker" id="swing-marker"></div>
      </div>

      <button class="swing-go" id="swing-go">SWING <span class="swing-key">or space</span></button>
      <p class="feedback" id="swing-feedback">&nbsp;</p>
    </section>

    <!-- ============================================================
         END OF INNING
         ============================================================ -->
    <section class="card hidden" id="summary-screen">
      <h2 class="summary-title" id="summary-title">Inning over</h2>
      <p class="summary-sub" id="summary-sub">Three outs.</p>

      <p class="boxscore-eyebrow">Box score</p>
      <ul class="summary-list">
        <li class="boxscore-total"><span>Runs</span> <strong id="sum-runs">0</strong></li>
        <li><span>Singles</span>    <strong id="sum-single">0</strong></li>
        <li><span>Doubles</span>    <strong id="sum-double">0</strong></li>
        <li><span>Triples</span>    <strong id="sum-triple">0</strong></li>
        <li><span>Home runs</span>  <strong id="sum-homerun">0</strong></li>
        <li><span>Total hits</span> <strong id="sum-hits">0</strong></li>
        <li><span>Left on base</span> <strong id="sum-lob">0</strong></li>
      </ul>

      <div class="missed" id="missed-block">
        <h3>Words that struck you out</h3>
        <ul id="missed-list"></ul>
      </div>

      <button class="play-again" id="play-again">Play another inning</button>
    </section>

  </main>

  <!-- Rules first, then the flow that drives them. -->
  <script src="rules.js"></script>
  <script src="scene.js"></script>
  <script src="timed.js"></script>
  <script src="timed-ui.js"></script>
</body>
</html>
